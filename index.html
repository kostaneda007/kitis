<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Расписание КИТИС — неделя</title>
<style>
:root{
  --bg:#0b0d12; --bg2:#11141c; --card:#171b26; --card2:#1d2333; --card3:#232c3e;
  --fg:#e6e9f0; --fg2:#9aa6b8; --fg3:#6b7688;
  --accent:#6c5ce7; --accent2:#00d2ff;
  --warn:#ff8a5c; --ok:#00d68f; --danger:#ff5c7a;
  --border:#2a3244; --radius:12px; --shadow:0 8px 28px rgba(0,0,0,.4);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--fg);
  -webkit-font-smoothing:antialiased;overflow:hidden;position:relative}
button{font-family:inherit}
a{color:var(--accent2);text-decoration:none}
.top{position:fixed;top:0;left:0;right:0;height:60px;z-index:30;
  display:flex;align-items:center;gap:14px;padding:0 20px;
  background:rgba(11,13,18,.85);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);border-radius:0 0 8px 8px;
  box-shadow:var(--shadow)}
.logo{font-size:20px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.top .date{font-size:12px;color:var(--fg2);font-weight:500}
.center{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);
  background:var(--card2);color:var(--fg2);cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center;transition:.15s}
.icon-btn:hover{background:var(--card);color:var(--fg)}
.icon-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.main{margin-top:60px;display:flex;gap:20px;padding:20px;height:calc(100vh - 60px);overflow:hidden}
@media (max-width: 1024px){.main{flex-direction:column;height:auto;padding:16px}.top{flex-wrap:wrap}}
@media (max-width: 600px){
  .top{padding:0 12px;height:52px}
  .main{padding:12px;gap:12px}
  .logo{font-size:16px}
}
.current-pair{
  background:linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius:12px;padding:20px;box-shadow:var(--shadow);
  position:relative;overflow:hidden;
}
.current-pair::after{content:"";position:absolute;right:-30px;top:-30px;
  width:120px;height:120px;border-radius:50%;
  background:linear-gradient(135deg, transparent 50%, rgba(255,255,255,.15));}
.current-pair .pair-number{font-size:48px;font-weight:800;color:#fff;line-height:1}
.current-pair .pair-time{font-size:22px;font-weight:600;color:#fff;margin-top:8px}
.current-pair .pair-detail{display:flex;flex-direction:column;gap:4px;margin-top:12px}
.current-pair .pair-detail span{font-size:13px;color:rgba(255,255,255,.9)}
.current-pair .pair-detail .room{font-weight:600;color:#fff}
.current-pair .countdown{font-size:32px;font-weight:700;color:#00d68f;margin-top:10px}
.countdown-label{font-size:11px;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:1px}
.main-grid{display:grid;grid-template-columns:280px 1fr;gap:20px;height:calc(100vh - 60px);overflow:hidden}
@media (max-width: 1024px){.main-grid{grid-template-columns:1fr;height:auto}}
.group-list{display:flex;flex-direction:column;gap:8px;max-height:calc(100% - 140px);overflow-y:auto;padding-right:8px}
.group-item{background:var(--card);border-radius:10px;padding:12px 14px;cursor:pointer;border:1px solid var(--border);transition:background .2s}
.group-item:hover{background:var(--card2)}
.group-item.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.group-item .group-name{font-size:15px;font-weight:600;color:var(--fg)}
.group-item .group-sub{font-size:12px;color:var(--fg2)}
table{width:100%;border-collapse:collapse;font-size:14px}
table th{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--fg2);padding:8px 6px;text-align:center;border-bottom:1px solid var(--border)}
table td{padding:8px 6px;border-left:1px solid var(--border)}
table td:first-child{font-weight:600}
table td.subject{font-weight:500;color:var(--fg)}
table td.room{color:var(--fg3);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
table tr:nth-child(even) td{background:rgba(255,255,255,.02)}
.load-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;padding:20px}
.load-stat{background:var(--card);border-radius:12px;padding:16px;font-size:13px}
.load-stat .label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--fg3)}
.load-stat .value{font-size:24px;font-weight:700;color:var(--fg)}
.load-stat .sub{font-size:12px;color:var(--fg2)}
.load-stat.plan .value{color:var(--accent2)}
.load-stat.fact .value{color:#ff8a5c}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
.modal-overlay.active{display:flex}
.modal{background:var(--card);border-radius:16px;padding:24px;max-width:500px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal h2{font-size:20px;margin-bottom:12px;color:var(--fg)}
.modal .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal .detail-item{background:var(--card2);border-radius:8px;padding:12px;color:var(--fg2);font-size:13px}
.modal .detail-item .label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--fg3);margin-bottom:4px}
.modal .detail-item .value{font-size:14px;color:var(--fg);font-weight:500}
.modal .close-btn{position:absolute;top:12px;right:12px;background:none;border:none;color:var(--fg2);font-size:24px;cursor:pointer;width:36px;height:36px;border-radius:50%;transition:.15s}
.modal .close-btn:hover{color:var(--fg);background:rgba(255,255,255,.1)}
</style>
</head>
<body>
<div class="top">
  <div class="logo">Расписание КИТИС</div>
  <div class="date" id="currentDate"></div>
  <div class="center">
    <button id="themeToggle" class="icon-btn" title="Тема">theme</button>
    <button id="navToggle" class="icon-btn" title="Навигация">menu</button>
  </div>
</div>
<div class="main">
  <div class="main-grid">
    <div>
      <div class="load-stats">
        <div class="load-stat plan">
          <div class="label">План</div>
          <div class="value">230</div>
          <div class="sub">часов</div>
        </div>
        <div class="load-stat fact">
          <div class="label">Факт</div>
          <div class="value">250</div>
          <div class="sub">часов</div>
        </div>
        <div class="load-stat">
          <div class="label">Выполнение</div>
          <div class="value">54.3%</div>
          <div class="sub">210 ч осталось</div>
        </div>
      </div>
      <div class="lesson-table">
        <table>
          <thead>
            <tr><th>Пара</th><th>Группа</th><th>Предмет</th><th>Аудитория</th><th>Преподаватель</th></tr>
          </thead>
          <tbody id="lessonBody"></tbody>
        </table>
      </div>
    </div>
    <div>
      <div class="group-list" id="groupList"></div>
    </div>
  </div>
</div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="close-btn" id="modalClose">close</button>
    <div id="modalContent"></div>
  </div>
</div>
<script src="site_data.js"></script>
<script>
let SCHED = window.__SCHED__ || {};

function formatDate(weekday) {
  const days = {'Пн':'Mon','Вт':'Tue','Ср':'Wed','Чт':'Thu','Пт':'Fri','Сб':'Sat','Вс':'Sun'};
  return days[weekday] || weekday;
}

function renderGroupList() {
  const container = document.getElementById('groupList');
  if (!container) return;
  container.innerHTML = '';
  const groups = SCHED.groups || [];
  groups.forEach(g => {
    const item = document.createElement('div');
    item.className = 'group-item';
    item.innerHTML = `<div class="group-name">${g.num} ${g.name}</div>`;
    item.addEventListener('click', () => {
      document.querySelectorAll('.group-item').forEach(el => el.classList.remove('active'));
      item.classList.add('active');
      renderTable(g);
    });
    container.appendChild(item);
  });
}

function renderTable(group) {
  const tbody = document.getElementById('lessonBody');
  if (!tbody) return;
  const lessons = group ? group.lessons : [];
  tbody.innerHTML = '';
  if (lessons.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--fg2)">Расписание на эту неделю пусто</td></tr>';
    return;
  }
  lessons.forEach(l => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${l.lesson}</td><td>${l.group}</td><td class="subject">${l.subject}</td><td class="room">${l.room}</td><td>${l.teacher}</td>`;
    tbody.appendChild(tr);
  });
}

function updateCurrentPair() {
  const now = new Date();
  const hours = now.getHours();
  const minutes = now.getMinutes();
  const currentTime = hours * 60 + minutes;

  const groups = SCHED.groups || [];
  let found = false;
  for (const group of groups) {
    for (const lesson of group.lessons) {
      const [sh, sm] = lesson.time_start.split(':').map(Number);
      const [eh, em] = lesson.time_end.split(':').map(Number);
      const start = sh * 60 + sm;
      const end = eh * 60 + em;
      if (currentTime >= start && currentTime <= end) {
        found = true;
        document.getElementById('pairNumber').textContent = lesson.lesson;
        document.getElementById('pairTime').textContent = lesson.time_start + ' ' + lesson.time_end;
        document.getElementById('pairRoom').textContent = 'Room: ' + lesson.room;
        document.getElementById('pairSubject').textContent = 'Subject: ' + lesson.subject;
        document.getElementById('pairTeacher').textContent = 'Teacher: ' + lesson.teacher;
        document.getElementById('pairGroup').textContent = 'Group: ' + lesson.group;
        break;
      }
    }
    if (found) break;
  }

  if (!found) {
    document.getElementById('pairNumber').textContent = '—';
    document.getElementById('pairTime').textContent = '—';
    document.getElementById('pairRoom').textContent = 'Room: —';
    document.getElementById('pairSubject').textContent = 'Subject: —';
    document.getElementById('pairTeacher').textContent = 'Teacher: —';
    document.getElementById('pairGroup').textContent = 'Group: —';
  }
}

function updateDate() {
  const now = new Date();
  const days = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
  const months = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
  const day = now.getDate();
  const month = months[now.getMonth()];
  const year = now.getFullYear();
  document.getElementById('currentDate').textContent = days[now.getDay()] + ' ' + day + ' ' + month + ' ' + year;
}

document.addEventListener('DOMContentLoaded', () => {
  renderGroupList();
  renderTable(SCHED.groups[0]);
  updateDate();
  setInterval(updateCurrentPair, 30000);
  updateCurrentPair();
});
</script>
</body>
</html>
